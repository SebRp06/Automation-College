# ===========================================================================
# serenity.properties  ->  Configuración general de Serenity BDD
# ===========================================================================

# Nombre que aparecerá en el reporte HTML
serenity.project.name=Demo Screenplay - API de QuickPizza

# Mostrar en el reporte el detalle de cada petición y respuesta REST
serenity.report.show.step.details=true

# Para APIs no necesitamos navegador
serenity.take.screenshots=DISABLED

# Agrupa el reporte por "Característica" (feature)
serenity.requirement.types=feature
